# PulseOne frontend — serves the built SPA and proxies the API to the Go
# backend on the same origin. Because the API is reached at the relative path
# /api/v1, this image carries no hostname or IP and runs unchanged on any
# droplet.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # Docker's embedded DNS. Paired with the variable in proxy_pass below, this
    # defers resolving the backend's name until a request arrives.
    #
    # Without it nginx resolves every upstream once, at startup, and REFUSES TO
    # START if the name does not resolve ("host not found in upstream"). That
    # would mean a backend that is down, restarting, or simply slower to come
    # up than nginx takes the entire site down with it — static pages included
    # — instead of just failing the API calls. This way nginx always boots,
    # serves the app, and returns 502 on /api until the backend is back.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 5s;

    # Proxy buffers sized for the report exports (CSV / Excel / PDF).
    proxy_buffer_size        16k;
    proxy_buffers         8  16k;
    proxy_busy_buffers_size  32k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff font/woff2;

    # Security headers. No CSP here: the app loads its own bundles only, but a
    # policy tight enough to matter needs the hash set from the build.
    add_header X-Content-Type-Options  "nosniff"            always;
    add_header X-Frame-Options         "SAMEORIGIN"         always;
    add_header Referrer-Policy         "same-origin"        always;
    add_header X-XSS-Protection        "0"                  always;

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    location /api/ {
        # A variable here is what makes nginx resolve at request time rather
        # than at startup. It also disables nginx's automatic URI passing, so
        # $request_uri is appended explicitly to preserve the path and query
        # string exactly as the browser sent them.
        set $pulseone_backend "http://${BACKEND_HOST}:${BACKEND_PORT}";

        proxy_pass         $pulseone_backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Report generation over a large date range can be slow; the read
        # timeout is set well above the default 60s so an export is not cut off.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_redirect off;
    }

    # Backend liveness, useful for probing through the front door.
    location = /health {
        set $pulseone_health "http://${BACKEND_HOST}:${BACKEND_PORT}/health";
        proxy_pass       $pulseone_health;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    # nginx's own liveness — answers even when the backend is down.
    location = /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Static assets
    # ---------------------------------------------------------------------
    # Vite fingerprints every file under /assets, so they are immutable.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
        try_files  $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on the old
    # bundle names and every asset request 404s.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ---------------------------------------------------------------------
    # SPA fallback — react-router owns every other path
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
